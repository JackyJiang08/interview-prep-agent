[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-prep-agent"
version = "0.2.0"
description = "Match job-description requirements against an evidence corpus and label each one PROOF or GAP."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Yuqing Jiang" }]
keywords = ["information-extraction", "text-matching", "traceability", "pipeline"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "pydantic>=2.12.5,<3",
    "PyYAML>=6.0,<7",
    "langgraph>=1.0,<2",
    "google-genai>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[project.scripts]
interview-prep-agent = "interview_prep_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets a bare `pytest` run from a clean checkout, before any install.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, bugbear, comprehensions, pyupgrade.
select = ["E", "F", "I", "B", "C4", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["interview_prep_agent"]
