[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-prep-agent"
version = "0.2.0"
description = "Match job-description requirements against an evidence corpus and label each one PROOF or GAP."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Yuqing Jiang" }]
keywords = ["information-extraction", "text-matching", "traceability", "pipeline"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[project.scripts]
interview-prep-agent = "interview_prep_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, bugbear, comprehensions, pyupgrade.
select = ["E", "F", "I", "B", "C4", "UP"]
# Pydantic evaluates annotations at run time, so PEP 604 unions ("str | None")
# raise TypeError on Python 3.9 even under `from __future__ import annotations`.
# This package supports 3.9, so Optional and Union stay until that floor rises.
ignore = ["UP007", "UP045"]

[tool.ruff.lint.isort]
known-first-party = ["interview_prep_agent"]
